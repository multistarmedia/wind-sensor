# Forge site nginx configuration (Site → Nginx). Replace 3456298 with your site's id if it differs,
# and keep the port in sync with PORT in .env.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_dhparam /etc/nginx/dhparams.pem;

# Security headers (CSP, X-Frame-Options, Permissions-Policy: serial=(self), ...) are set by the
# Node app. Don't add them here as well, or browsers receive conflicting duplicates.

charset utf-8;

# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/3456298/server/*;

# Everything goes to the Node app. Nothing from the repository is served from disk.
location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 1m;
    proxy_read_timeout 60s;
}

# CSV exports can be large; stream them instead of buffering.
location = /api/export.csv {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
}

location = /robots.txt  { access_log off; log_not_found off; }

access_log off;
error_log  /var/log/nginx/3456298-error.log error;

location ~ /\.(?!well-known).* {
    deny all;
}
