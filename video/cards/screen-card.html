<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AIO 2 Weather Console screen card</title>
<!--
  Narrated-video card showing a real capture of the console (taken during the recording) with an optional
  camera move. Self-contained, offline over file://, 1920×1080. Paths in "image" are relative to this file.
  Config is URL-encoded JSON in the location hash:
    {
      "label":    "ON YOUR PHONE",                 // pill top-left ("" hides)
      "caption":  "Same address. [Same readings].", // [brackets] get the accent
      "image":    "../out/shots/phone.png",
      "moves":    [ { "at": 0.4, "zoom": 1.3, "x": 0.5, "y": 0.2 } ],  // [] for none
      "duration": 6, "still": false, "loop": false
    }
-->
<style>
  :root { --sky:#38bdf8; }
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; }
  body { background:radial-gradient(110% 90% at 80% 10%, #13213b 0%, #0a1324 45%, #050a14 100%); color:#f1f5f9;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif; }
  .bar { position:absolute; left:0; right:0; top:0; height:12px; background:linear-gradient(90deg,#3b82f6,#06b6d4,#22c55e,#eab308,#f97316,#ef4444,#a21caf); transform:scaleX(0); transform-origin:left; }
  .bar.in { transform:none; transition:transform 1s cubic-bezier(.22,1,.36,1); }
  .label { position:absolute; left:160px; top:300px; padding:9px 20px; border-radius:999px; background:var(--sky); color:#04111f;
    font-weight:800; font-size:22px; letter-spacing:3px; opacity:0; transform:translateY(-10px); }
  .caption { position:absolute; left:160px; top:370px; width:820px; font-size:76px; font-weight:800; letter-spacing:-2.2px; line-height:1.05; opacity:0; transform:translateY(24px); }
  .caption b { color:var(--sky); }
  .in { opacity:1 !important; transform:none !important; transition:opacity .5s ease, transform .7s cubic-bezier(.22,1,.36,1); }
  /* Captions burn in near the bottom, so the shot stops at 880 */
  .frame { position:absolute; right:220px; top:70px; height:810px; display:flex; }
  .shot { position:relative; height:100%; border-radius:44px; overflow:hidden; background:#000; border:14px solid #1f2937;
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 2px #334155; opacity:0; transform:translateY(40px) scale(.97); }
  .shot img { display:block; height:100%; width:auto; transform-origin:50% 0; transition:transform 1.4s cubic-bezier(.65,0,.35,1); }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="label" id="label"></div>
<div class="caption" id="caption"></div>
<div class="frame"><div class="shot" id="shot"><img id="img" alt="" /></div></div>
<script>
  const DEFAULTS = { label: "PREVIEW", caption: "Same address. [Same readings].", image: "../out/shots/phone.png", moves: [], duration: 6, still: false, loop: !location.hash };
  let cfg = { ...DEFAULTS };
  try { if (location.hash.length > 1) cfg = { ...DEFAULTS, ...JSON.parse(decodeURIComponent(location.hash.slice(1))) }; } catch {}
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  $("label").textContent = cfg.label || ""; $("label").style.display = cfg.label ? "block" : "none";
  $("caption").innerHTML = esc(cfg.caption || "").replace(/\[([^\]]+)\]/g, "<b>$1</b>");
  $("img").src = cfg.image;
  const steps = [[0, () => $("bar").classList.add("in")], [0.04, () => $("label").classList.add("in")], [0.08, () => $("caption").classList.add("in")], [0.12, () => $("shot").classList.add("in")]];
  for (const m of cfg.moves || []) steps.push([m.at, () => { $("img").style.transformOrigin = `${(m.x ?? 0.5) * 100}% ${(m.y ?? 0) * 100}%`; $("img").style.transform = `scale(${m.zoom ?? 1})`; }]);
  function run() {
    document.querySelectorAll(".in").forEach((e) => e.classList.remove("in"));
    $("img").style.transform = "";
    const ms = Math.max(2, Number(cfg.duration) || 6) * 1000;
    if (cfg.still) { steps.forEach(([, fn]) => fn()); return; }
    steps.forEach(([at, fn]) => setTimeout(fn, at * ms));
    if (cfg.loop) setTimeout(run, ms + 1200);
  }
  const img = $("img");
  (img.complete ? Promise.resolve() : new Promise((r) => { img.onload = img.onerror = r; })).then(run);
</script>
</body>
</html>
